teacher_ckpt: ./results/checkpoints/teacher/MonkeyI_20160622_01/best_finetune.ckpt
output_dir: ./results/checkpoints/distill
device: cuda
model:
  spatial_patch_size: 32
  d_hidden: 256
  num_encoder_layers: 10
  num_heads: 8
  kernel_size: 5
  dilation: 2
  dropout: 0.1
  use_flash_attention: false
  max_pos: 1024
training:
  batch_size: 32
  max_epochs: 400
  early_stop_patience: 50
  num_workers: 4
  lambda_align: 5.0
  max_lr: 0.000625
  start_factor: 0.3
  warmup_epochs: 30
  decay_factor: 0.995
  weight_decay: 0.1
dataset:
  session: MonkeyI_20160622_01
  lfp_metadata_path: /gfs/share/datasets/MakinRT_gzjTest/metadata_3a4b4.csv
  spike_segment_dir: /gfs/share/datasets/MakinRT_gzjTest/spike_segments_5s
  session_info_path: /gfs/share/datasets/MakinRT_gzjTest/spike_session_info.csv
  split: train
