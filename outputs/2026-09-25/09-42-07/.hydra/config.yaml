output_dir: ./results/checkpoints/ms_lfp
device: cuda
model:
  spatial_patch_size: 32
  d_hidden: 256
  num_encoder_layers: 10
  num_heads: 8
  kernel_size: 5
  dilation: 2
  dropout: 0.1
  use_flash_attention: false
  max_pos: 1024
training:
  batch_size: 32
  max_epochs: 400
  early_stop_patience: 50
  num_workers: 4
  max_lr: 0.000625
  start_factor: 0.3
  warmup_epochs: 30
  decay_factor: 0.995
  weight_decay: 0.1
dataset:
  lfp_metadata_path: /gfs/share/datasets/MakinRT_gzjTest/metadata_3a4b4.csv
  split: train
