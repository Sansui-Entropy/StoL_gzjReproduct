# Distilled-LFP 5s dataset for Monkey I only (no FlintCO).
# Reuses 10s segments under MakinRT_gzjTest; original MakinRT/ is never modified.
defaults:
  - single/makin_rt@config

_target_: cross_modal_distillation.data.multi_dataset.MultiSessionDataset
_recursive_: False
config:
  makin_rt:
    config:
      root_save_dir: /gfs/share/datasets
      save_dir: /gfs/share/datasets/MakinRT_gzjTest
      segment_from_existing_data: True
      existing_data_segment_length: 10
      segment_length: 5
      pretrain_sessions:
        - MonkeyI_20160622_01
      include_sessions:
        - MonkeyI_20160624_03
        - MonkeyI_20160627_01
        - MonkeyI_20160916_01
        - MonkeyI_20160921_01
        - MonkeyI_20160927_04
        - MonkeyI_20160927_06
        - MonkeyI_20160930_02
        - MonkeyI_20160930_05
        - MonkeyI_20161005_06
        - MonkeyI_20161006_02
        - MonkeyI_20161007_02
        - MonkeyI_20161011_03
        - MonkeyI_20161014_04
        - MonkeyI_20161017_02
        - MonkeyI_20161024_03
        - MonkeyI_20161025_04
        - MonkeyI_20161026_03
        - MonkeyI_20161027_03
