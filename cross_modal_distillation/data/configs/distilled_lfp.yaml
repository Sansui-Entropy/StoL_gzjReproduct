# Combined MakinRT + FlintCO distilled-LFP 5s config (paper default).
# For a single dataset use distilled_lfp_makin.yaml or distilled_lfp_flint.yaml.
defaults:
  - single/makin_rt@config
  - single/flint_co@config

_target_: cross_modal_distillation.data.multi_dataset.MultiSessionDataset
_recursive_: False
config:
  makin_rt: 
    config:
      segment_from_existing_data: True
      existing_data_segment_length: 10
      segment_length: 5
      pretrain_sessions: 
        - MonkeyI_20160622_01
  flint_co: 
    config:
      segment_from_existing_data: True
      existing_data_segment_length: 10
      segment_length: 5
      pretrain_sessions: 
        - MonkeyC_e1_1